[package]
name = "apple-iroh"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "iroh as a static library for Apple platforms, with a C ABI"
repository = "https://github.com/misterbisson/apple-iroh"

[lib]
name = "apple_iroh"
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
# Pinned exactly. The artifact this repo publishes is a binary somebody else
# builds against, so "whatever resolves today" is not a dependency spec — a
# caller pinning our tag has to get the same iroh every time.
# `unstable-net-report` for `apple_iroh_net_report`: the probe results iroh
# already takes to decide how to reach the internet. Unstable upstream, which is
# one more reason the version is pinned exactly.
iroh = { version = "=1.2.0", features = ["unstable-net-report"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "net"] }

# **Two crates under iroh, patched to name tvOS.** Each picks its Apple code by
# operating system and lists `macos` and `ios` only, so neither compiles for an
# Apple TV. `patch-crates.sh` fetches each as crates.io published it, checks it
# against the checksum `Cargo.lock` held, and applies the diff in `patches/`.
# `patched/` is not in the repository, so run that script (or
# `build-xcframework.sh`, which runs it) before `cargo` is asked for anything.
[patch.crates-io]
netdev = { path = "patched/netdev" }
netwatch = { path = "patched/netwatch" }

[profile.release]
# The consumer is an app binary. Size is the thing being traded for here.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = false
