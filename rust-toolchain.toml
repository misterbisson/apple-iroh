# Pinned so a new compiler cannot change the artifact without anybody deciding
# to.
#
# A laptop build and the first CI build of the same commit differed —
# 12,808,323 bytes against 12,837,365 — on rustc version alone. Pinning removes
# that. It was NOT by itself enough to make the build reproducible: two CI runs
# of one commit on this pinned toolchain still differed, because the zip records
# modification times. `build-xcframework.sh` normalises those; this file and
# that step are both needed and neither is sufficient.
#
# Xcode is deliberately NOT pinned. That is a standing rule in the consuming
# project: no Xcode version gate, locally or in CI, because SDK moves are
# handled by fixing the code rather than by freezing the toolchain. So a
# reproduction is exact for a given Xcode and not across Xcode releases, and the
# release notes say which one built each artifact.
[toolchain]
channel = "1.98.1"
# Five Rust targets, three xcframework slices. The Simulator and macOS slices
# are `lipo`d universal because the consuming app builds universal in Release —
# `ARCHS = arm64 x86_64` — and a Mac app that links an arm64-only archive fails
# at link on the x86_64 arm, in the Release configuration nobody builds locally.
# Found that way, on the one command that reproduces what Xcode Cloud does.
targets = [
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "x86_64-apple-ios",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
