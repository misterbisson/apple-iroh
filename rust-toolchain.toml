# Pinned so the same source gives the same bytes.
#
# The first CI build produced a different checksum from the same commit built on
# a laptop — 12,837,365 bytes against 12,808,323 — because the two had different
# rustc versions. That is expected, and it is also the difference between "this
# checksum identifies the artifact" and "this checksum can be re-derived from
# the source", which is the stronger claim and the one worth having.
#
# Xcode is deliberately NOT pinned. That is a standing rule in the consuming
# project: no Xcode version gate, locally or in CI, because SDK moves are
# handled by fixing the code rather than by freezing the toolchain. So a
# reproduction is exact for a given Xcode and not across Xcode releases, and the
# release notes say which one built each artifact.
[toolchain]
channel = "1.98.1"
targets = ["aarch64-apple-ios", "aarch64-apple-ios-sim", "aarch64-apple-darwin"]
